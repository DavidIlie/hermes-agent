name: Fleet image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fleet-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image tag
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          short_sha="${GITHUB_SHA:0:10}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermes-agent-fleet"
          tag="v2026.8.22-friends.${short_sha}"
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"

      - name: Build and publish exact amd64 image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hermes-agent-fleet-amd64
          cache-to: type=gha,mode=max,scope=hermes-agent-fleet-amd64

      - name: Record immutable publication
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DIGEST"
          printf 'source=%s\nimage=%s:%s\ndigest=%s\nimmutable=%s:%s@%s\n' \
            "$GITHUB_SHA" "$IMAGE" "$TAG" "$DIGEST" "$IMAGE" "$TAG" "$DIGEST" \
            | tee fleet-image.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fleet-image-${{ github.sha }}
          path: fleet-image.txt
          if-no-files-found: error
          retention-days: 30
